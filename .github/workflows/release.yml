name: Release

# Push a tag such as v3.0.0 to build the exe on GitHub and attach it to a release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Verify
        run: |
          dotnet build MouseGlowTrail.sln -c Release
          dotnet MouseGlowTrail.Bench/bin/Release/net10.0-windows/MouseGlowTrail.Bench.dll verify out

      - name: Publish
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          dotnet publish MouseGlowTrail/MouseGlowTrail.csproj -c Release -o publish
          $package = "MouseGlowTrail-$version-win-x64"
          New-Item -ItemType Directory $package | Out-Null
          Copy-Item publish/MouseGlowTrail.exe, LICENSE $package
          Copy-Item README.md "$package/README.md"
          Copy-Item README.zh-CN.md "$package/README.zh-CN.md"
          Compress-Archive -Path "$package/*" -DestinationPath "$package.zip"
          # sha256sum format (lowercase, LF) so `sha256sum -c` works as-is.
          $hash = (Get-FileHash "$package.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText("$PWD/$package.zip.sha256", "$hash  $package.zip`n")
          "PACKAGE=$package" >> $env:GITHUB_ENV

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.PACKAGE }}.zip
            ${{ env.PACKAGE }}.zip.sha256
          generate_release_notes: true
