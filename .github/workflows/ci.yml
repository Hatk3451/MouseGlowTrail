name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build MouseGlowTrail.sln -c Release

      # Renderer invariants; the GPU comparison is skipped on runners without a hardware GPU.
      - name: Verify
        run: dotnet MouseGlowTrail.Bench/bin/Release/net10.0-windows/MouseGlowTrail.Bench.dll verify out

      - name: Publish
        run: dotnet publish MouseGlowTrail/MouseGlowTrail.csproj -c Release -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: MouseGlowTrail-win-x64
          path: publish/MouseGlowTrail.exe
